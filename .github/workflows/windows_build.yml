name: Compilar Executavel Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Gerar executavel com PyInstaller
        run: pyinstaller --noconfirm --clean packaging/ebookbuilder.spec

      - name: Compactar executavel Windows
        shell: pwsh
        run: Compress-Archive -Path dist/EbookBuilder/* -DestinationPath EbookBuilder_Windows_x86_64.zip

      - name: Criar release e anexar artefato
        uses: softprops/action-gh-release@v2
        with:
          files: EbookBuilder_Windows_x86_64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
